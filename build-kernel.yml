name: Build GKI Kernel - Pixel 7 (Android 13)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug mode'
        required: false
        default: false

jobs:
  build-gki-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            python3 \
            libssl-dev \
            bc \
            bison \
            flex \
            libelf-dev \
            ccache \
            repo \
            wget
          
          echo "✅ Build dependencies installed"
      
      - name: Setup Android NDK
        run: |
          NDK_VERSION="r23c"
          NDK_DIR="${HOME}/android-ndk"
          
          if [ ! -d "$NDK_DIR" ]; then
            echo "📥 Downloading Android NDK ${NDK_VERSION}..."
            wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
            unzip -q android-ndk-${NDK_VERSION}-linux.zip -d ${HOME}/
            mv ${HOME}/android-ndk-${NDK_VERSION} $NDK_DIR
            rm android-ndk-${NDK_VERSION}-linux.zip
          fi
          
          echo "NDK_DIR=$NDK_DIR" >> $GITHUB_ENV
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          
          # Verify toolchain
          aarch64-linux-android-gcc --version || aarch64-linux-android31-clang --version
          echo "✅ Android NDK configured"
      
      - name: Setup Clang toolchain
        run: |
          sudo apt-get install -y clang-12 llvm-12
          
          # Create symlinks for cross-compilation
          sudo ln -sf /usr/bin/clang-12 /usr/bin/clang
          sudo ln -sf /usr/bin/llvm-ar-12 /usr/bin/llvm-ar
          
          clang --version
          echo "✅ Clang toolchain ready"
      
      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: gki-kernel-${{ runner.os }}
          max-size: 2G
      
      - name: Make build script executable
        run: |
          chmod +x ./build-gki-kernel.sh
          ls -lah build-gki-kernel.sh
      
      - name: Build GKI Kernel
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
          LINUX_COMPILE_BY: android-build
          LINUX_COMPILE_HOST: google.com
        run: |
          echo "🔨 Starting kernel build process..."
          bash ./build-gki-kernel.sh 2>&1 | tee build.log
          
          if [ $? -ne 0 ]; then
            echo "❌ Build failed!"
            tail -100 build.log
            exit 1
          fi
          
          echo "✅ Kernel build completed"
      
      - name: Verify build artifacts
        if: success()
        run: |
          echo "📦 Checking build artifacts..."
          
          BUILD_DIR="kernel-build/output"
          
          if [ -d "$BUILD_DIR" ]; then
            echo "Contents of $BUILD_DIR:"
            ls -lah "$BUILD_DIR"
            
            # Count artifacts
            ARTIFACTS=$(ls -1 "$BUILD_DIR" | wc -l)
            echo "📊 Found $ARTIFACTS artifacts"
            
            # Check for kernel image
            if [ -f "$BUILD_DIR/Image.gz" ] || [ -f "$BUILD_DIR/Image" ]; then
              echo "✅ Kernel image found"
            else
              echo "⚠️  Warning: Kernel image not found"
            fi
            
            # Check for defconfig
            if [ -f "$BUILD_DIR/gki_defconfig" ]; then
              echo "✅ Configuration file found"
              echo "Kprobes config:"
              grep CONFIG_KPROBE "$BUILD_DIR/gki_defconfig" || echo "⚠️  Kprobes not enabled"
              echo "SuSFS config:"
              grep CONFIG_SUSFS "$BUILD_DIR/gki_defconfig" || echo "⚠️  SuSFS not enabled"
            fi
          else
            echo "⚠️  Output directory not found"
          fi
      
      - name: Generate build report
        if: always()
        run: |
          echo "# Kernel Build Report" > BUILD_REPORT.md
          echo "" >> BUILD_REPORT.md
          echo "## Build Information" >> BUILD_REPORT.md
          echo "- **Timestamp**: $(date)" >> BUILD_REPORT.md
          echo "- **Kernel Branch**: common-android13-5.10" >> BUILD_REPORT.md
          echo "- **Device**: Pixel 7 (panther)" >> BUILD_REPORT.md
          echo "- **Architecture**: aarch64" >> BUILD_REPORT.md
          echo "" >> BUILD_REPORT.md
          echo "## Integrated Components" >> BUILD_REPORT.md
          echo "- ✅ KernelSU Next" >> BUILD_REPORT.md
          echo "- ✅ SuSFS v1.5.7" >> BUILD_REPORT.md
          echo "- ✅ Kprobes Support" >> BUILD_REPORT.md
          echo "- ✅ Metadata Masking" >> BUILD_REPORT.md
          echo "" >> BUILD_REPORT.md
          echo "## Build Status" >> BUILD_REPORT.md
          
          if [ -f "kernel-build/output/Image.gz" ] || [ -f "kernel-build/output/Image" ]; then
            echo "✅ **BUILD SUCCESSFUL**" >> BUILD_REPORT.md
          else
            echo "❌ **BUILD FAILED**" >> BUILD_REPORT.md
          fi
          
          echo "" >> BUILD_REPORT.md
          echo "## Build Log Excerpt" >> BUILD_REPORT.md
          echo "\`\`\`" >> BUILD_REPORT.md
          tail -50 build.log >> BUILD_REPORT.md || echo "No build log available" >> BUILD_REPORT.md
          echo "\`\`\`" >> BUILD_REPORT.md
          
          cat BUILD_REPORT.md
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: gki-kernel-pixel7
          path: |
            kernel-build/output/
            BUILD_REPORT.md
            build.log
          retention-days: 30
          if-no-files-found: warn
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Build failed!"
          echo "Build log:"
          tail -200 build.log || echo "No log available"
          exit 1

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-gki-kernel
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "🎯 Build Job Status: ${{ needs.build-gki-kernel.result }}"
          
          if [ "${{ needs.build-gki-kernel.result }}" == "success" ]; then
            echo "✅ Kernel build completed successfully!"
            echo "📦 Artifacts are available for download"
            exit 0
          else
            echo "❌ Kernel build failed"
            exit 1
          fi
