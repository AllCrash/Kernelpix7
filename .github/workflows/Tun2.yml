name: Build Pixel 7 GKI 5.10 (Android 13) - KSU Next + SuSFS + Kprobes

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Repo Tool & Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo bc bison build-essential flex git gnupg gperf libelf-dev libssl-dev libncurses-dev zip curl

      - name: Initialize GKI Workspace (Android 13 - Kernel 5.10)
        run: |
          mkdir -p gki-workspace
          cd gki-workspace
          git config --global user.name "Kernel Builder"
          git config --global user.email "builder@kernel.local"
          
          # Жестко фиксируем ветку android13-5.10 для Pixel 7 (GKI)
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.10 --depth=1
          repo sync -j$(nproc) --current-branch --no-tags --force-sync

      - name: Integrate KernelSU Next (Latest)
        run: |
          cd gki-workspace/common
          echo "📥 Клонирование KernelSU Next..."
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu
          
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Clone and Apply SuSFS Patches (v1.5.7)
        run: |
          cd gki-workspace
          echo "📥 Клонирование репозитория патчей SuSFS..."
          git clone --depth=1 https://github.com/coderfan1/susfs4ksu.git susfs_src
          
          echo "📂 Копирование файлов SuSFS в дерево ядра..."
          cp susfs_src/kernel/fs/susfs.c common/fs/
          cp susfs_src/kernel/include/linux/susfs.h common/include/linux/
          
          cd common
          echo "🔧 Наложение патча SuSFS на ядро 5.10..."
          patch -p1 --batch < ../susfs_src/5.10/0001-Provisionally-add-SuSFS-in-kernel-5.10.patch || echo "⚠️ Смещение строк в ядре (не критично)."
          
          echo "🔧 Наложение патча SuSFS на KernelSU Next..."
          cd drivers/kernelsu
          patch -p1 --batch < ../../../../susfs_src/5.10/0001-Add-SuSFS-v1.5.7-to-KernelSU-Next.patch || {
            echo "❌ Ошибка: Патч SuSFS несовместим со свежим коммитом KernelSU Next!"
            exit 1
          }

      - name: Spoof Kernel Version (Скрытие следов кастомной сборки)
        run: |
          cd gki-workspace/common
          echo "🎭 Маскировка метаданных компиляции ядра под сток Google..."
          # Изменяем стандартные переменные сборки, чтобы скрыть имя хоста GitHub Actions и имя юзера runner
          sed -i 's/export LINUX_COMPILE_BY=.*/export LINUX_COMPILE_BY="android-build"/' scripts/mkcompile_h
          sed -i 's/export LINUX_COMPILE_HOST=.*/export LINUX_COMPILE_HOST="google.com"/' scripts/mkcompile_h

      - name: Inject Kprobes & SuSFS into Defconfig
        run: |
          cd gki-workspace/common
          echo "🔧 Включение параметров Kprobes и SuSFS в gki_defconfig..."
          
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          if [ ! -f "$CONFIG_FILE" ]; then
            CONFIG_FILE="build/arch/arm64/configs/gki_defconfig"
          fi
          
          if [ -f "$CONFIG_FILE" ]; then
            sed -i '/CONFIG_KPROBES/d' "$CONFIG_FILE"
            sed -i '/CONFIG_HAVE_KPROBES/d' "$CONFIG_FILE"
            sed -i '/CONFIG_KPROBE_EVENTS/d' "$CONFIG_FILE"
            sed -i '/CONFIG_SUSFS/d' "$CONFIG_FILE"
            
            echo "CONFIG_KPROBES=y" >> "$CONFIG_FILE"
            echo "CONFIG_HAVE_KPROBES=y" >> "$CONFIG_FILE"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$CONFIG_FILE"
            echo "CONFIG_SUSFS=y" >> "$CONFIG_FILE"
            echo "✅ gki_defconfig успешно настроен."
          else
            echo "❌ Ошибка: gki_defconfig не найден!"
            exit 1
          fi

      - name: Build GKI Kernel
        run: |
          cd gki-workspace
          echo "🚀 Запуск официального билдера Google Android..."
          
          export LTO=thin
          export BUILD_CONFIG=common/build.config.gki.aarch64
          
          # Вырезаем принудительный check_defconfig, мешающий собирать кастомные флаги
          sed -i 's/POST_DEFCONFIG_CMDS="check_defconfig"//g' common/build.config.gki.aarch64 || true
          
          ./build/build.sh

      - name: Pack Into AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          IMAGE_PATH=$(find gki-workspace/out -name "Image" | head -n 1)
          
          if [ -z "$IMAGE_PATH" ] || [ ! -f "$IMAGE_PATH" ]; then
            echo "❌ Ошибка: Скомпилированный Image ядра не найден!"
            exit 1
          fi
          
          cp "$IMAGE_PATH" AnyKernel3/
          
          cd AnyKernel3
          # Отключаем проверку устройства, чтобы zip под подходил к GKI 5.10 без проблем
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r ../AnyKernel3-Pixel7-A13-KernelSU-Next.zip ./*

      - name: Upload Finished Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Pixel7-A13-SuSFS-Kprobes
          path: AnyKernel3-Pixel7-A13-KernelSU-Next.zip
