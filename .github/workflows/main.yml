name: Build GKI 5.10 KernelSU Next + SuSFS

on:
  workflow_dispatch:
    inputs:
      ANDROID_VERSION:
        description: "Выберите ветку Android Common Kernel"
        required: true
        default: "android13-5.10"
        type: choice
        options:
          - android13-5.10
          - android14-5.10
          - android15-5.10

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Repo Tool & Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo bc bison build-essential flex git gnupg gperf libelf-dev libssl-dev libncurses-dev zip curl

      - name: Initialize GKI Workspace
        run: |
          mkdir -p gki-workspace
          cd gki-workspace
          git config --global user.name "Kernel Builder"
          git config --global user.email "builder@kernel.local"
          
          # Синхронизируем манифест GKI от Google
          repo init -u https://android.googlesource.com/kernel/manifest -b common-${{ github.event.inputs.ANDROID_VERSION }} --depth=1
          repo sync -j$(nproc) --current-branch --no-tags --force-sync

      - name: Integrate KernelSU Next
        run: |
          cd gki-workspace/common
          echo "📥 Клонирование KernelSU Next..."
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu
          
          # Интеграция в Makefile драйверов
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Clone and Apply SuSFS Patches
        run: |
          cd gki-workspace
          echo "📥 Клонирование официального репозитория SuSFS..."
          git clone --depth=1 https://gitlab.com/tiann/susfs4ksu.git susfs_src
          
          # 1. Копируем файлы SuSFS в структуру исходников ядра
          echo "📂 Копирование файлов SuSFS..."
          cp susfs_src/kernel/fs/susfs.c common/fs/
          cp susfs_src/kernel/include/linux/susfs.h common/include/linux/
          
          # 2. Патчим само ядро (common) патчем для ветки 5.10
          cd common
          echo "🔧 Наложение патча SuSFS на ядро 5.10..."
          patch -p1 --batch < ../susfs_src/5.10/0001-Provisionally-add-SuSFS-in-kernel-5.10.patch || echo "⚠️ Предупреждение: возможно частичное смещение строк в ядре."
          
          # 3. Патчим KernelSU Next патчем из репозитория SuSFS
          echo "🔧 Наложение патча SuSFS на KernelSU Next..."
          cd drivers/kernelsu
          patch -p1 --batch < ../../../../susfs_src/5.10/0001-Add-SuSFS-v1.5.7-to-KernelSU-Next.patch || {
            echo "❌ Ошибка: Патч SuSFS несовместим с текущей версией KernelSU Next!"
            exit 1
          }

      - name: Inject Kprobes & SuSFS into Defconfig
        run: |
          cd gki-workspace/common
          echo "🔧 Модификация дефконфига под Kprobes и SuSFS..."
          
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          if [ ! -f "$CONFIG_FILE" ]; then
            CONFIG_FILE="build/arch/arm64/configs/gki_defconfig"
          fi
          
          if [ -f "$CONFIG_FILE" ]; then
            # Очищаем старые параметры, если они были, и пишем заново
            sed -i '/CONFIG_KPROBES/d' "$CONFIG_FILE"
            sed -i '/CONFIG_HAVE_KPROBES/d' "$CONFIG_FILE"
            sed -i '/CONFIG_KPROBE_EVENTS/d' "$CONFIG_FILE"
            sed -i '/CONFIG_SUSFS/d' "$CONFIG_FILE"
            
            echo "CONFIG_KPROBES=y" >> "$CONFIG_FILE"
            echo "CONFIG_HAVE_KPROBES=y" >> "$CONFIG_FILE"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$CONFIG_FILE"
            echo "CONFIG_SUSFS=y" >> "$CONFIG_FILE"
            echo "✅ Дефконфиг успешно изменен."
          else
            echo "❌ Ошибка: gki_defconfig не найден!"
            exit 1
          fi

      - name: Build GKI Kernel
        run: |
          cd gki-workspace
          echo "🚀 Запуск сборщика ядра Android..."
          
          export LTO=thin
          export BUILD_CONFIG=common/build.config.gki.aarch64
          
          # Отключаем принудительную проверку check_defconfig от Google.
          # Она блокирует компиляцию, если видит несанкционированные конфиги вроде KPROBES/SUSFS.
          sed -i 's/POST_DEFCONFIG_CMDS="check_defconfig"//g' common/build.config.gki.aarch64 || true
          
          ./build/build.sh

      - name: Pack Into AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # Ищем собранный Image
          IMAGE_PATH=$(find gki-workspace/out -name "Image" | head -n 1)
          
          if [ -z "$IMAGE_PATH" ] || [ ! -f "$IMAGE_PATH" ]; then
            echo "❌ Ошибка: Скомпилированный файл Image не найден!"
            exit 1
          fi
          
          cp "$IMAGE_PATH" AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r ../AnyKernel3-Pixel7-GKI-5.10.zip ./*

      - name: Upload Finished Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-KernelSU-Next-SuSFS-${{ github.event.inputs.ANDROID_VERSION }}
          path: AnyKernel3-Pixel7-GKI-5.10.zip
