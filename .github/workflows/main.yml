name: Build GKI 5.10 KernelSU Next + SuSFS

on:
  workflow_dispatch:
    inputs:
      ANDROID_VERSION:
        description: "Выберите версию Android"
        required: true
        default: "android13-5.10"
        type: choice
        options:
          - android13-5.10
          - android14-5.10
          - android15-5.10

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git gnupg gperf libelf-dev libssl-dev libncurses-dev zip curl jq

      - name: Download Official Google Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          echo "📥 Скачивание стабильного компилятора Google Clang..."
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          tar -xzf clang-r450784d.tar.gz
          rm -f clang-r450784d.tar.gz

      - name: Clone GKI Kernel Source
        run: |
          echo "📥 Клонирование исходников ядра GKI 5.10 для ${{ github.event.inputs.ANDROID_VERSION }}..."
          git clone --depth=1 -b common-${{ github.event.inputs.ANDROID_VERSION }} https://android.googlesource.com/kernel/common $GITHUB_WORKSPACE/kernel-src

      - name: Integrate KernelSU Next
        run: |
          cd $GITHUB_WORKSPACE/kernel-src
          echo "📥 Интеграция KernelSU Next..."
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu
          echo "obj-y += kernelsu/" >> drivers/Makefile

      - name: Patch SuSFS
        run: |
          cd $GITHUB_WORKSPACE/kernel-src
          echo "📥 Наложение патчей маскировки SuSFS..."
          curl -LSs "https://raw.githubusercontent.com/galaxybuild-project/tools/refs/heads/main/Patches/0001_susfs_157_for_ksunext.patch" > susfs.patch
          patch -p1 < susfs.patch || echo "⚠️ Предупреждение: некоторые строки сместились, это нормально."
          rm -f susfs.patch

      - name: Configure Kprobes and SuSFS in Defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel-src
          echo "🔧 Подготовка gki_defconfig и принудительное включение Кпобле..."
          
          # Корректно копируем базовый GKI конфиг из папки build в общую директорию arch
          cp build/arch/arm64/configs/gki_defconfig arch/arm64/configs/gki_defconfig
          
          # Прописываем наши параметры скрытия и рута
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_SUSFS=y" >> arch/arm64/configs/gki_defconfig

      - name: Build GKI Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel-src
          
          # Добавляем наш Clang в системный путь
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          
          echo "🛠️ Сборка конфигурации..."
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          
          echo "🚀 Запуск компиляции ядра Image..."
          make -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld Image

      - name: Pack Into AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          if [ ! -f "$GITHUB_WORKSPACE/kernel-src/arch/arm64/boot/Image" ]; then
            echo "❌ Ошибка: Ядро не скомпилировалось!"
            exit 1
          fi
          
          cp $GITHUB_WORKSPACE/kernel-src/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r ../AnyKernel3-GKI-5.10-KSU-Next-SuSFS.zip ./*

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-GKI-5.10-${{ github.event.inputs.ANDROID_VERSION }}
          path: AnyKernel3-GKI-5.10-KSU-Next-SuSFS.zip
